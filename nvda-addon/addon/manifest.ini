name = "eurekaA4Emulator"
summary = "Eureka A4 – klávesnica pre emulátor"
description = "Kým klávesnicu vlastní emulovaná Eureka, NVDA nad jeho hlavným oknom mlčí a nechá jej všetky klávesy — Eureka hovorí sama. V ponuke, v dialógoch a po Shift+F11 číta NVDA ako inde. Na rozdiel od NVDA+Shift+S sa spánok viaže na okno, nie na celú aplikáciu. Keď sa pohne posuvníkom emulátora, ohlási jeho novú polohu, napríklad hlasitosť 12 z 20."
author = "Lubos Pintes"
version = "1.1.0"
minimumNVDAVersion = "2024.1"
lastTestedNVDAVersion = "2026.1"
